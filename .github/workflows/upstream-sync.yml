name: Reviewed upstream sync

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: bluplai-upstream-sync
  cancel-in-progress: false

permissions: {}

jobs:
  propose-sync:
    name: Propose reviewed upstream merge
    if: github.repository == 'skyremote/bluplai-buzz'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout fork main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Activate pinned toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Verify pinned package toolchain
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(npm --version)" = "11.12.1"
          test "$(pnpm --version)" = "11.4.0"
      - name: Prepare merge and delta report
        id: prepare
        env:
          UPSTREAM_URL: https://github.com/block/buzz.git
        run: |
          set -euo pipefail
          git config user.name "bluplai-upstream-sync[bot]"
          git config user.email "bluplai-upstream-sync[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main

          current_base="$(tr -d '[:space:]' < UPSTREAM_BASE)"
          upstream_head="$(git rev-parse upstream/main)"
          git cat-file -e "${current_base}^{commit}"
          git merge-base --is-ancestor "$current_base" "$upstream_head"
          git merge-base --is-ancestor "$current_base" HEAD

          if [ "$current_base" = "$upstream_head" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "UPSTREAM_BASE already matches upstream/main at $upstream_head." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="sync/upstream-${upstream_head:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "A review branch already exists: $branch" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git switch -c "$branch"
          git merge --no-ff --no-commit upstream/main
          printf '%s\n' "$upstream_head" > UPSTREAM_BASE

          report="$RUNNER_TEMP/upstream-delta.md"
          {
            echo "## Upstream delta"
            echo
            echo "- Previous audited base: \`$current_base\`"
            echo "- Proposed upstream base: \`$upstream_head\`"
            echo "- Fork head before merge: \`$GITHUB_SHA\`"
            echo
            echo "### Incoming upstream commits"
            echo
            git log --format='- `%h` %s' "$current_base..$upstream_head"
            echo
            echo "### Bluplai delta after merge"
            echo
            echo '```text'
            git diff --stat "$upstream_head" -- . \
              ':(exclude)UPSTREAM_BASE'
            echo '```'
            echo
            echo "This draft never deploys. Merge requires human review plus the"
            echo "upstream and Bluplai compatibility gates in this workflow."
          } > "$report"

          git add UPSTREAM_BASE
          git commit -s -m "chore: sync upstream ${upstream_head:0:12}"
          candidate_head="$(git rev-parse HEAD)"
          test "$(git rev-parse "${candidate_head}^1")" = "$GITHUB_SHA"
          test "$(git rev-parse "${candidate_head}^2")" = "$upstream_head"
          test "$(git show "${candidate_head}:UPSTREAM_BASE" | tr -d '[:space:]')" = "$upstream_head"
          git merge-base --is-ancestor "$upstream_head" "$candidate_head"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$upstream_head" >> "$GITHUB_OUTPUT"
      - name: Install JavaScript workspace
        if: steps.prepare.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run Bluplai compatibility gates
        if: steps.prepare.outputs.changed == 'true'
        run: |
          pnpm --filter @bluplai/buzz-chat-react check
          pnpm --filter @bluplai/buzz-chat-react test
          pnpm --filter @bluplai/buzz-chat-react build
      - name: Run upstream checks
        if: steps.prepare.outputs.changed == 'true'
        run: |
          just check
          just test-unit
      - name: Reproducibly pack candidate
        if: steps.prepare.outputs.changed == 'true'
        id: candidate
        shell: bash
        working-directory: packages/bluplai-chat-react
        run: |
          set -euo pipefail
          first_dir="$RUNNER_TEMP/bluplai-chat-package-first"
          second_dir="$RUNNER_TEMP/bluplai-chat-package-second"
          mkdir -p "$first_dir" "$second_dir"
          npm pack --pack-destination "$first_dir"
          npm pack --pack-destination "$second_dir"
          first_tarball="$first_dir/$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-')+'-'+p.version+'.tgz'")"
          second_tarball="$second_dir/$(basename "$first_tarball")"
          test -f "$first_tarball"
          test -f "$second_tarball"
          cmp "$first_tarball" "$second_tarball"

          upstream_sha="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/UPSTREAM_BASE")"
          fork_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          first_parent_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^1)"
          second_parent_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^2)"
          test "$second_parent_sha" = "$upstream_sha"
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$upstream_sha" "$fork_sha"
          package_version="$(node -p "require('./package.json').version")"
          tarball_sha256="$(sha256sum "$first_tarball" | awk '{print $1}')"

          jq -n \
            --arg upstream_sha "$upstream_sha" \
            --arg fork_sha "$fork_sha" \
            --arg first_parent_sha "$first_parent_sha" \
            --arg second_parent_sha "$second_parent_sha" \
            --arg package_version "$package_version" \
            --arg tarball "$(basename "$first_tarball")" \
            --arg tarball_sha256 "$tarball_sha256" \
            '{
              schema_version: 1,
              upstream: {repository: "https://github.com/block/buzz", sha: $upstream_sha},
              fork: {
                repository: "https://github.com/skyremote/bluplai-buzz",
                sha: $fork_sha,
                audited_merge_sha: $fork_sha,
                first_parent_sha: $first_parent_sha,
                second_parent_sha: $second_parent_sha
              },
              package: {
                name: "@bluplai/buzz-chat-react",
                version: $package_version,
                tarball: $tarball,
                sha256: $tarball_sha256
              }
            }' > "$RUNNER_TEMP/package-provenance.json"

          {
            echo "### Bluplai package candidate"
            echo
            echo "- Upstream SHA: \`$upstream_sha\`"
            echo "- Fork SHA: \`$fork_sha\`"
            echo "- Package version: \`$package_version\`"
            echo "- Tarball SHA-256: \`$tarball_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "fork_sha=$fork_sha" >> "$GITHUB_OUTPUT"
          echo "tarball=$first_tarball" >> "$GITHUB_OUTPUT"
      - name: Upload delta report
        if: always() && steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-delta-${{ steps.prepare.outputs.upstream_head }}
          path: |
            ${{ runner.temp }}/upstream-delta.md
            ${{ steps.candidate.outputs.tarball }}
            ${{ runner.temp }}/package-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Push reviewed-sync branch
        if: steps.prepare.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: git push --set-upstream "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"
      - name: Open draft pull request
        if: steps.prepare.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_HEAD: ${{ steps.prepare.outputs.upstream_head }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --draft \
            --title "chore: review upstream ${UPSTREAM_HEAD:0:12}" \
            --body-file "$RUNNER_TEMP/upstream-delta.md"
