name: Bluplai browser compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/bluplai-compatibility.yml"
      - "UPSTREAM_BASE"
      - "docs/UPSTREAM_ADOPTION.md"
      - "packages/bluplai-chat-react/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/bluplai-compatibility.yml"
      - "UPSTREAM_BASE"
      - "docs/UPSTREAM_ADOPTION.md"
      - "packages/bluplai-chat-react/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: bluplai-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  package-candidate:
    name: React 18 package candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Activate pinned toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check browser and type boundaries
        run: pnpm --filter @bluplai/buzz-chat-react check
      - name: Test React 18 host behavior
        run: pnpm --filter @bluplai/buzz-chat-react test
      - name: Build production package
        run: pnpm --filter @bluplai/buzz-chat-react build
      - name: Pack and attest exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/bluplai-chat-package"
          mkdir -p "$package_dir"
          pnpm --filter @bluplai/buzz-chat-react pack --pack-destination "$package_dir"
          tarball="$(find "$package_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"

          upstream_sha="$(tr -d '[:space:]' < UPSTREAM_BASE)"
          fork_sha="$(git rev-parse HEAD)"
          package_version="$(node -p "require('./packages/bluplai-chat-react/package.json').version")"
          tarball_sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          git cat-file -e "${upstream_sha}^{commit}"

          audited_merge_sha="$(git log -1 --format='%H' -- UPSTREAM_BASE)"
          audited_first_parent_sha="$(git rev-parse "${audited_merge_sha}^1")"
          audited_second_parent_sha="$(git rev-parse "${audited_merge_sha}^2")"
          recorded_base="$(git show "${audited_merge_sha}:UPSTREAM_BASE" | tr -d '[:space:]')"
          test "$recorded_base" = "$upstream_sha"
          test "$audited_second_parent_sha" = "$upstream_sha"
          if [ "$fork_sha" = "$audited_merge_sha" ]; then
            test "$(git rev-parse HEAD^2)" = "$upstream_sha"
          fi
          git merge-base --is-ancestor "$upstream_sha" "$fork_sha"
          git merge-base --is-ancestor "$audited_merge_sha" "$fork_sha"

          jq -n \
            --arg upstream_sha "$upstream_sha" \
            --arg fork_sha "$fork_sha" \
            --arg audited_merge_sha "$audited_merge_sha" \
            --arg audited_first_parent_sha "$audited_first_parent_sha" \
            --arg audited_second_parent_sha "$audited_second_parent_sha" \
            --arg package_version "$package_version" \
            --arg tarball "$(basename "$tarball")" \
            --arg tarball_sha256 "$tarball_sha256" \
            '{
              schema_version: 1,
              upstream: {repository: "https://github.com/block/buzz", sha: $upstream_sha},
              fork: {
                repository: "https://github.com/skyremote/bluplai-buzz",
                sha: $fork_sha,
                audited_merge_sha: $audited_merge_sha,
                first_parent_sha: $audited_first_parent_sha,
                second_parent_sha: $audited_second_parent_sha
              },
              package: {
                name: "@bluplai/buzz-chat-react",
                version: $package_version,
                tarball: $tarball,
                sha256: $tarball_sha256
              }
            }' > "$RUNNER_TEMP/package-provenance.json"

          {
            echo "### Bluplai package candidate"
            echo
            echo "- Upstream SHA: \`$upstream_sha\`"
            echo "- Fork SHA: \`$fork_sha\`"
            echo "- Package version: \`$package_version\`"
            echo "- Tarball SHA-256: \`$tarball_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "fork_sha=$fork_sha" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "tarball_sha256=$tarball_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload immutable package and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bluplai-buzz-chat-react-${{ steps.candidate.outputs.fork_sha }}
          path: |
            ${{ steps.candidate.outputs.tarball }}
            ${{ runner.temp }}/package-provenance.json
          if-no-files-found: error
          retention-days: 30
