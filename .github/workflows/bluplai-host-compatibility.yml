name: Bluplai trusted host compatibility

on:
  workflow_run:
    workflows: ["Bluplai browser compatibility"]
    types: [completed]

concurrency:
  group: bluplai-trusted-host-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  clean-host:
    name: Immutable package in private Bluplai host
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download immutable candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate-artifacts
      - name: Verify candidate artifact identity
        id: candidate
        shell: bash
        env:
          EXPECTED_FORK_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find "$RUNNER_TEMP/candidate-artifacts" -type f -name '*.tgz')
          mapfile -t attestations < <(find "$RUNNER_TEMP/candidate-artifacts" -type f -name 'package-provenance.json')
          test "${#tarballs[@]}" -eq 1
          test "${#attestations[@]}" -eq 1
          tarball="${tarballs[0]}"
          attestation="${attestations[0]}"

          expected_hash="$(jq -r '.package.sha256' "$attestation")"
          actual_hash="$(sha256sum "$tarball" | awk '{print $1}')"
          test "$actual_hash" = "$expected_hash"
          test "$(jq -r '.fork.sha' "$attestation")" = "$EXPECTED_FORK_SHA"
          test "$(jq -r '.package.tarball' "$attestation")" = "$(basename "$tarball")"

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "attestation=$attestation" >> "$GITHUB_OUTPUT"
      - name: Checkout full pinned Buzz history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: skyremote/bluplai-buzz
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: buzz-source
      - name: Verify audited merge-parent chain
        id: history
        shell: bash
        env:
          ATTESTATION: ${{ steps.candidate.outputs.attestation }}
          EXPECTED_FORK_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          cd buzz-source
          test "$(git rev-parse HEAD)" = "$EXPECTED_FORK_SHA"

          upstream_sha="$(jq -r '.upstream.sha' "$ATTESTATION")"
          fork_sha="$(jq -r '.fork.sha' "$ATTESTATION")"
          audited_merge_sha="$(jq -r '.fork.audited_merge_sha' "$ATTESTATION")"
          first_parent_sha="$(jq -r '.fork.first_parent_sha' "$ATTESTATION")"
          second_parent_sha="$(jq -r '.fork.second_parent_sha' "$ATTESTATION")"
          package_version="$(jq -r '.package.version' "$ATTESTATION")"
          tarball_sha256="$(jq -r '.package.sha256' "$ATTESTATION")"

          git cat-file -e "${upstream_sha}^{commit}"
          test "$(tr -d '[:space:]' < UPSTREAM_BASE)" = "$upstream_sha"
          test "$(git rev-parse "${audited_merge_sha}^1")" = "$first_parent_sha"
          test "$(git rev-parse "${audited_merge_sha}^2")" = "$second_parent_sha"
          test "$second_parent_sha" = "$upstream_sha"
          if [ "$fork_sha" = "$audited_merge_sha" ]; then
            test "$(git rev-parse HEAD^2)" = "$upstream_sha"
          fi
          git merge-base --is-ancestor "$upstream_sha" "$fork_sha"
          git merge-base --is-ancestor "$audited_merge_sha" "$fork_sha"

          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "fork_sha=$fork_sha" >> "$GITHUB_OUTPUT"
          echo "audited_merge_sha=$audited_merge_sha" >> "$GITHUB_OUTPUT"
          echo "first_parent_sha=$first_parent_sha" >> "$GITHUB_OUTPUT"
          echo "second_parent_sha=$second_parent_sha" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tarball_sha256=$tarball_sha256" >> "$GITHUB_OUTPUT"
      - name: Checkout clean private Bluplai host
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: skyremote/bluplai-david
          ref: main
          token: ${{ secrets.BLUPLAI_HOST_READ_TOKEN }}
          persist-credentials: false
          path: bluplai-host
      - name: Activate pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install exact candidate into Bluplai host
        shell: bash
        env:
          CANDIDATE_TARBALL: ${{ steps.candidate.outputs.tarball }}
          CANDIDATE_VERSION: ${{ steps.history.outputs.package_version }}
        run: |
          set -euo pipefail
          cd bluplai-host
          npm ci

          candidate_dir="$RUNNER_TEMP/exact-bluplai-chat-package"
          mkdir -p "$candidate_dir"
          tar -xzf "$CANDIDATE_TARBALL" -C "$candidate_dir"
          test -d "$candidate_dir/package"

          installed_path="node_modules/@bluplai/buzz-chat-react"
          test -d "$installed_path"
          mv "$installed_path" "$RUNNER_TEMP/host-pinned-bluplai-chat-package"
          mv "$candidate_dir/package" "$installed_path"
          installed_version="$(node -p "require('./node_modules/@bluplai/buzz-chat-react/package.json').version")"
          test "$installed_version" = "$CANDIDATE_VERSION"
      - name: Require accepted host provenance
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.history.outputs.upstream_sha }}
          FORK_SHA: ${{ steps.history.outputs.fork_sha }}
          AUDITED_MERGE_SHA: ${{ steps.history.outputs.audited_merge_sha }}
          FIRST_PARENT_SHA: ${{ steps.history.outputs.first_parent_sha }}
          SECOND_PARENT_SHA: ${{ steps.history.outputs.second_parent_sha }}
          PACKAGE_VERSION: ${{ steps.history.outputs.package_version }}
          TARBALL_SHA256: ${{ steps.history.outputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          provenance="bluplai-host/internal-docs/releases/buzz-package-provenance.json"
          test -f "$provenance"
          jq -e \
            --arg upstream_sha "$UPSTREAM_SHA" \
            --arg fork_sha "$FORK_SHA" \
            --arg audited_merge_sha "$AUDITED_MERGE_SHA" \
            --arg first_parent_sha "$FIRST_PARENT_SHA" \
            --arg second_parent_sha "$SECOND_PARENT_SHA" \
            --arg package_version "$PACKAGE_VERSION" \
            --arg tarball_sha256 "$TARBALL_SHA256" \
            '.upstream.sha == $upstream_sha
              and .fork.sha == $fork_sha
              and .fork.audited_merge_sha == $audited_merge_sha
              and .fork.first_parent_sha == $first_parent_sha
              and .fork.second_parent_sha == $second_parent_sha
              and .package.version == $package_version
              and .package.sha256 == $tarball_sha256
              and .acceptance.status == "accepted"
              and .acceptance.deployment_authorized == false' \
            "$provenance"
      - name: Run Bluplai package and host contracts
        working-directory: bluplai-host
        run: |
          npm run test -- --run \
            src/features/buzz-chat/__tests__/buzzChatTransport.test.ts \
            src/features/buzz-chat/__tests__/BuzzChatProvider.test.tsx \
            src/features/buzz-chat/__tests__/BuzzChatWorkspace.test.tsx \
            src/features/buzz-chat/__tests__/scopedBuzzChatTransport.test.ts
          npm run build
